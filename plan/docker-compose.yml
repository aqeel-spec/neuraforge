version: '3.8'

services:
  neuraforge:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEURAFORGE_PORT=3000
      - NEURAFORGE_HOST=0.0.0.0
      - NEURAFORGE_STORAGE=local
      - NEURAFORGE_DATA_DIR=/data
    volumes:
      - neuraforge-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neuraforge-data:
