name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string
      dry-run:
        description: 'Dry run (no publish)'
        required: false
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: plan/package-lock.json

      - name: Install dependencies
        working-directory: ./plan
        run: npm ci

      - name: Run full check
        working-directory: ./plan
        run: npm run check && npm run test:property

      - name: Set version
        working-directory: ./plan
        run: |
          npx json -I -f package.json -e "this.version='${{ inputs.version }}'"
          for pkg in packages/*/package.json services/*/package.json; do
            npx json -I -f $pkg -e "this.version='${{ inputs.version }}'"
          done

      - name: Publish packages
        if: ${{ !inputs.dry-run }}
        working-directory: ./plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/schemas packages/catalog-core packages/tokens packages/components packages/motion packages/three-d packages/compositions packages/registry-builder packages/mcp-core packages/cli packages/conformance packages/telemetry packages/self-hosting packages/release-policy; do
            echo "Publishing $pkg..."
            cd $pkg && npm publish --access public && cd ../..
          done
