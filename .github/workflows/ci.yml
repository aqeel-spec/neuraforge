name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plan/package-lock.json

      - name: Install dependencies
        working-directory: ./plan
        run: npm ci

      - name: Run full check
        working-directory: ./plan
        run: npm run check

      - name: Run property tests
        working-directory: ./plan
        run: npm run test:property

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plan/package-lock.json

      - name: Install dependencies
        working-directory: ./plan
        run: npm ci

      - name: Verify packages can be packed
        working-directory: ./plan
        run: |
          for pkg in packages/schemas packages/catalog-core packages/tokens packages/components packages/motion packages/three-d packages/compositions packages/registry-builder packages/mcp-core packages/cli packages/conformance packages/telemetry packages/self-hosting packages/release-policy; do
            echo "Packing $pkg..."
            cd $pkg && npm pack --dry-run && cd ../.. 
          done
